<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Math Score Prediction</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --border: #d1d5db;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #edf4ff 0%, #f8fafc 50%, #ecfeff 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(900px, 100%);
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .full { grid-column: 1 / -1; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.92rem;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      background: #fff;
    }

    input:focus, select:focus {
      outline: 2px solid rgba(15, 118, 110, 0.25);
      border-color: var(--primary);
    }

    button {
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      padding: 11px 16px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover { background: var(--primary-hover); }

    .result {
      margin-top: 18px;
      background: #ecfeff;
      border: 1px solid #99f6e4;
      color: #134e4a;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 600;
    }

    @media (max-width: 720px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Student Math Score Predictor</h1>
    <p>Enter student profile details to estimate the math score.</p>

    <form action="{{ url_for('predict_datapoint') }}" method="post">
      <div>
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div>
        <label for="race_ethnicity">Race / Ethnicity</label>
        <select id="race_ethnicity" name="race_ethnicity" required>
          <option value="">Select</option>
          <option value="group A">Group A</option>
          <option value="group B">Group B</option>
          <option value="group C">Group C</option>
          <option value="group D">Group D</option>
          <option value="group E">Group E</option>
        </select>
      </div>

      <div>
        <label for="parental_level_of_education">Parental Level of Education</label>
        <select id="parental_level_of_education" name="parental_level_of_education" required>
          <option value="">Select</option>
          <option value="some high school">Some high school</option>
          <option value="high school">High school</option>
          <option value="some college">Some college</option>
          <option value="associate's degree">Associate's degree</option>
          <option value="bachelor's degree">Bachelor's degree</option>
          <option value="master's degree">Master's degree</option>
        </select>
      </div>

      <div>
        <label for="lunch">Lunch</label>
        <select id="lunch" name="lunch" required>
          <option value="">Select</option>
          <option value="standard">Standard</option>
          <option value="free/reduced">Free/Reduced</option>
        </select>
      </div>

      <div>
        <label for="test_preparation_course">Test Preparation Course</label>
        <select id="test_preparation_course" name="test_preparation_course" required>
          <option value="">Select</option>
          <option value="none">None</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <div>
        <label for="reading_score">Reading Score</label>
        <input id="reading_score" name="reading_score" type="number" min="0" max="100" step="1" required />
      </div>

      <div>
        <label for="writing_score">Writing Score</label>
        <input id="writing_score" name="writing_score" type="number" min="0" max="100" step="1" required />
      </div>

      <div class="full">
        <button type="submit">Predict Math Score</button>
      </div>
    </form>

    {% if results is defined and results is not none %}
      <div class="result">Predicted Math Score: {{ results }}</div>
    {% endif %}
  </main>
</body>
</html>
